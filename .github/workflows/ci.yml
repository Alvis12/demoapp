name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests with Maven
        run: |
            chmod +x mvnw
            ./mvnw test

      - name: Build JAR
        run: |
            chmod +x mvnw
            ./mvnw package -DskipTests

      - name: Build Docker image
        run: docker build -t demoapp .